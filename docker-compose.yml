# =============================================================================
# PHASE 2+ ONLY — DO NOT USE IN PHASE 1
# =============================================================================
#
# Phase 1 uses: docker-compose.backend-only.yml
#   - Existing mongo-cnber stays untouched on default bridge
#   - Temp backend reaches Mongo via host.docker.internal:27017
#
# This file describes a FUTURE optional layout where both services share a
# user-defined Docker network and Backend uses:
#   mongodb://mongo-cnber:27017/cnber
#
# FORBIDDEN until Phase 1 A/B PASS + explicit user approval for Phase 2:
#   - docker compose -f docker-compose.yml up
#   - stop / recreate mongo-cnber
#   - attach a different / empty data volume
#   - replace volumes:
#       data:   d2319608a2ae5f1502a725cca8274762efd3e02d3bee9363d8223528b722bcca
#       config: f5e04826694f87ac4d5afd660b5282550221bf1b87a9b1550ccc67ba3fbe1fdb
#
# M1 verified (do not invent replacements):
#   container: mongo-cnber
#   image:     mongo:7
#   network:   bridge
#   ports:     0.0.0.0:27017 -> 27017/tcp
#   restart:   unless-stopped
#
# If this file is ever activated, volumes MUST be external:true pointing at the
# existing anonymous volume IDs above (or their docker volume names if renamed).

name: cnber

services:
  # Intentionally commented / gated — Phase 1 must not manage mongo-cnber.
  mongo-cnber:
    profiles: ["phase2-do-not-use"]
    image: mongo:7
    container_name: mongo-cnber
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - type: volume
        source: cnber_mongo_data
        target: /data/db
      - type: volume
        source: cnber_mongo_config
        target: /data/configdb
    networks:
      - cnber_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cnber-backend:
    profiles: ["phase2-do-not-use"]
    build:
      context: ./CNber_backend
      dockerfile: Dockerfile
    image: cnber-backend:local
    container_name: cnber-backend
    restart: unless-stopped
    depends_on:
      mongo-cnber:
        condition: service_healthy
    env_file:
      - ./CNber_backend/.env.docker
    environment:
      NODE_ENV: production
      PORT: "3100"
      MONGO_URL: mongodb://mongo-cnber:27017/cnber
      MONGO_URI: mongodb://mongo-cnber:27017/cnber
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${CNBER_HOST_PORT:-13100}:3100"
    volumes:
      - ${CNBER_RUNTIME_ROOT:?Set CNBER_RUNTIME_ROOT}/public/uploads:/app/public/uploads
      - ${CNBER_RUNTIME_ROOT}/public/downloads:/app/public/downloads
      - ${CNBER_RUNTIME_ROOT}/public/admin:/app/public/admin
      - ${CNBER_RUNTIME_ROOT}/logs:/app/logs
    networks:
      - cnber_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  cnber_net:
    name: cnber_net
    driver: bridge

volumes:
  # MUST be external and map to the EXISTING M1 volumes — never create empty ones.
  cnber_mongo_data:
    external: true
    name: d2319608a2ae5f1502a725cca8274762efd3e02d3bee9363d8223528b722bcca
  cnber_mongo_config:
    external: true
    name: f5e04826694f87ac4d5afd660b5282550221bf1b87a9b1550ccc67ba3fbe1fdb
